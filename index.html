<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#101820">
  <title>Mapa de postos</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map"></div>

  <section class="top">
    <h1>⛽ Postos e paradas sugeridas</h1>
    <div class="search-row">
      <input id="search" type="search" placeholder="Buscar posto ou município…" autocomplete="off">
      <button id="gps" type="button">◎ Minha posição</button>
    </div>

    <details class="datasets" open>
      <summary>Conjuntos de postos <span id="dataset-count"></span></summary>
      <div id="dataset-list" class="dataset-list">
        <p class="muted">Carregando conjuntos…</p>
      </div>
    </details>

    <div class="meta">
      <span id="count">Carregando pontos…</span>
      <span id="status" class="status">GPS não iniciado</span>
    </div>
  </section>

  <div class="legend"><span class="station-dot"></span> Postos/paradas
    <span class="user-dot-legend"></span> Sua localização</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
